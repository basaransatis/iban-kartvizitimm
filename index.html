
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBAN Kartviziti</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:24px;min-height:100vh;
  display:grid;place-items:center;
  background:#0b1220;color:#fff;
  font-family:Arial,sans-serif
}
.card{
  width:100%;max-width:400px;padding:26px;
  background:#142033;border-radius:22px;
  border:1px solid #304057
}
.label{color:#aab9cc;font-size:12px;
  margin-top:24px;letter-spacing:1px}
.value{font-size:17px;margin-top:8px;
  overflow-wrap:anywhere}
.iban{padding:15px;background:#202e43;
  border-radius:10px;font-weight:bold}
button{width:100%;padding:16px;margin-top:22px;
  background:#159765;color:white;border:0;
  border-radius:12px;font-size:16px;
  font-weight:bold}
#status{text-align:center;color:#8ee5b9}
</style>
</head>
<body>
<main class="card">
  <h2>💳 IBAN Kartviziti</h2>
  <p style="color:#aab9cc">Ödeme bilgileri</p>

  <div class="label">İŞLETME / HESAP SAHİBİ</div>
  <div class="value" id="owner">İşletme adı</div>

  <div class="label">BANKA</div>
  <div class="value" id="bank">Banka adı</div>

  <div class="label">IBAN</div>
  <div class="value iban" id="iban">IBAN bilgisi</div>

  <button onclick="copyInfo()">📋 Tüm Bilgileri Kopyala</button>
  <p id="status" aria-live="polite"></p>
</main>
<script>
const p = new URLSearchParams(location.search);
const owner = p.get("ad") || "İşletme adı";
const bank = p.get("banka") || "Banka adı";
const iban = p.get("iban") || "IBAN bilgisi";

document.getElementById("owner").textContent = owner;
document.getElementById("bank").textContent = bank;
document.getElementById("iban").textContent = iban;

async function copyInfo(){
  const text = `Hesap sahibi: ${owner}\nBanka: ${bank}\nIBAN: ${iban}`;
  try{
    await navigator.clipboard.writeText(text);
    document.getElementById("status").textContent =
      "✓ Bilgiler kopyalandı!";
  }catch(e){
    const t = document.createElement("textarea");
    t.value = text;
    document.body.appendChild(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    document.getElementById("status").textContent =
      ok ? "✓ Bilgiler kopyalandı!" :
      "Kopyalanamadı; bilgileri elle seçebilirsin.";
  }
}
</script>
</body>
</html>
